name: Linter

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install PHP Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Node Dependencies
        run: npm ci

      - name: Run PHP Pint
        run: ./vendor/bin/pint

      - name: Build Assets
        run: npm run build

      - name: Format Frontend
        run: npm run format
        continue-on-error: true

      - name: Lint Frontend
        run: npm run lint
        continue-on-error: true
