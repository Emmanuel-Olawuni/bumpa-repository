[phases.setup]
nixPkgs = ["php84", "php84Extensions.mbstring", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.openssl", "php84Extensions.curl", "php84Extensions.dom", "php84Extensions.zip", "php84Extensions.bcmath", "nodejs_22", "npm-9_x"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-dev --no-interaction --no-scripts"]

[phases.build]
cmds = ["npm install", "npm run build"]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
